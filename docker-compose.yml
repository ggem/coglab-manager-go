services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coglab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coglab}
      POSTGRES_DB: ${POSTGRES_DB:-coglab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-coglab}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
