services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coglab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coglab}
      POSTGRES_DB: ${POSTGRES_DB:-coglab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-coglab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local dev/test OIDC provider for the SSO login flow -- see
  # dex/config.yaml for the static test client and user this ships with.
  # Not part of any production deployment (a real institutional IdP is
  # configured there via OIDC_* env vars instead).
  dex:
    image: dexidp/dex:v2.41.1
    restart: unless-stopped
    ports:
      - "${DEX_PORT:-5556}:5556"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    command: ["dex", "serve", "/etc/dex/config.yaml"]

volumes:
  pgdata:
