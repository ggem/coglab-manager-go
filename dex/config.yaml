# Local dev/test OIDC provider for the SSO flow -- not used in production,
# where a real institutional IdP is configured instead. Storage is in-memory
# ("sqlite3" pointing at :memory: isn't supported by the static config
# loader, so this uses Dex's dedicated in-memory backend): nothing here
# needs to survive a restart, since every user/client is defined statically
# below.
issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /tmp/dex.db

web:
  http: 0.0.0.0:5556

# redirectURIs points at the Vite dev server (5173), not the Go API
# directly (8080) -- vite.config.ts proxies /auth/* through to the API,
# which is what makes the final post-login Set-Cookie land under the
# same origin the SPA runs on, the same way /login already works today.
# OIDC_REDIRECT_URL must be set to match when starting the API locally.
staticClients:
  - id: coglab-local
    secret: coglab-local-secret
    name: CogLab Manager (local dev)
    redirectURIs:
      - http://localhost:5173/auth/sso/callback

# One static test account, so the whole SSO flow (login -> Dex ->
# callback -> session) is exercisable with zero external accounts.
# Password is "password" -- bcrypt hash below, from Dex's own
# example-app config, reused here for the same reason: it's a
# well-known, non-secret local-dev-only credential.
staticPasswords:
  - email: "sso-test@example.edu"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "sso-test"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"

enablePasswordDB: true
