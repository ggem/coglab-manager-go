server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) resolves compose service names.
    # A plain `proxy_pass http://api:8080` resolves "api" once at config
    # load and fails to start nginx at all if that name isn't resolvable
    # yet -- routing the hostname through a variable instead defers
    # resolution to request time, so nginx starts regardless of the api
    # container's startup order and re-resolves per `valid` window.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8080;

    # /set-password is unique: it's both a real SPA page (where the
    # account-creation invite email's link lands, a GET for index.html)
    # and the JSON endpoint that page's form POSTs to. Only the POST
    # goes to the API; the GET falls through to the SPA below -- same
    # split frontend/vite.config.ts's dev proxy encodes via its `bypass`
    # function.
    location = /set-password {
        if ($request_method = POST) {
            proxy_pass $api_upstream;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        try_files /index.html =404;
    }

    # Every top-level path the Go API actually serves. Keep this in sync
    # with the `apiPaths` list in frontend/vite.config.ts -- that's the
    # dev-time equivalent of this same split (specific prefixes proxy to
    # the API, everything else is the SPA).
    location ~ ^/(healthz|login|logout|me|families|guardians|children|labs|recruitment-sources|conditions|condition-values|equipment|experiment-roles|experiment-types|experiments|appointments|availability|schedule-blockings|protocols|grants|zip-codes|newsletters|roles|auth|admin)(/|$) {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
